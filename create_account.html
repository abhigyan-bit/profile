<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
<style>.auth-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto;color:#17112f;font:800 27px Arial;text-decoration:none}.auth-brand img{width:43px;height:43px}.auth-brand span span{color:#7132c8}</style>
</head>
<body>
<a class="auth-brand" href="index.html"><img src="logo.svg" alt=""><span>Local<span>Vibe</span></span></a>
    
        <div class="auth-modal-box">
            <button class="close-btn" onclick="closeModal('signup-modal')">×</button>
            <h2>Create an Account</h2>
            <p class="modal-subtitle">Join LocalVibe to explore and shop local.</p>

            <form id="signup-form">
            <div class="input-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" minlength="6" required>
            </div>

            <div class="input-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" placeholder="Repeat password" required>
            </div>

            <button type="submit" class="auth-submit-btn">Sign Up</button>
            </form>

            <p class="modal-footer-text">
            Already have an account? 
            <a href="signin.html" onclick="switchModal('signup-modal', 'signin-modal')">Sign In</a>
            </p>
        </div>


<script src="profile.js"></script>
</body>
</html>
