<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | LocalVibe</title><link rel="stylesheet" href="style.css">
<style>body{font-family:Arial;background:#f8f2fc}.auth-modal-box{max-width:430px;margin:35px auto;background:white;padding:28px;border-radius:12px}.input-group{margin:14px 0}.input-group label{display:block;margin-bottom:6px}.input-group input{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px}.auth-submit-btn{background:purple;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer}</style>
</head><body><div class="auth-modal-box">
<h2>Create an Account</h2><p>Join LocalVibe to explore and shop local.</p>
<form id="signup-form">
<div class="input-group"><label for="signup-name">Full Name</label><input id="signup-name" type="text" required></div>
<div class="input-group"><label for="signup-email">Email</label><input id="signup-email" type="email" required></div>
<div class="input-group"><label for="signup-phone">Phone</label><input id="signup-phone" type="tel"></div>
<div class="input-group"><label for="signup-address">Address</label><input id="signup-address" type="text"></div>
<div class="input-group"><label for="signup-password">Password</label><input id="signup-password" type="password" minlength="6" required></div>
<div class="input-group"><label for="signup-confirm">Confirm Password</label><input id="signup-confirm" type="password" required></div>
<button class="auth-submit-btn" type="submit">Sign Up</button></form>
<p>Already registered? <a href="signin.html">Sign In</a></p></div>
<script src="app.js"></script></body></html>
