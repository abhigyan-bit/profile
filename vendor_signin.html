<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Sign In | LocalVibe</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="index.html">LocalVibe</a>
    <nav><a href="index.html">Home</a><a href="vendor_signup.html">Become a Vendor</a></nav>
</header>
<main class="auth-box">
    <h1>Vendor Sign In</h1>
    <p>Sign in to manage your LocalVibe store.</p>
    <form id="vendorLoginForm">
        <label for="vendorEmail">Email Address</label>
        <input id="vendorEmail" type="email" required>
        <label for="vendorPassword">Password</label>
        <input id="vendorPassword" type="password" required>
        <button type="submit">Sign In</button>
    </form>
    <p class="auth-note">New vendor? <a href="vendor_signup.html">Create your vendor account</a></p>
    <p class="auth-note"><a href="signin.html">Customer sign in</a></p>
</main>
<script src="profile.js"></script>
</body>
</html>
