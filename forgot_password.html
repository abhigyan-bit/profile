<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
<style>.auth-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto;color:#17112f;font:800 27px Arial;text-decoration:none}.auth-brand img{width:43px;height:43px}.auth-brand span span{color:#7132c8}</style>
</head>
<body>
<a class="auth-brand" href="index.html"><img src="logo.svg" alt=""><span>Local<span>Vibe</span></span></a>
  <div class="forgot-box">
    <button class="forgot-close" onclick="closeForgotModal()">&times;</button>
    <h2>Forgot Password?</h2>
    <p class="forgot-subtitle">Enter your registered email and we'll send you a reset link.</p>

    <div id="reset-feedback" class="reset-success-msg">
      Reset link sent! Please check your inbox.
    </div>

    <form id="forgot-form">
      <div class="forgot-input-group">
        <label for="forgot-email">Email Address</label>
        <input type="email" id="forgot-email" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="forgot-submit-btn">Send Reset Link</button>
    </form>

    <p class="forgot-footer">
      Remembered your password? 
      <a href="signin.html" onclick="backToSignIn()">Back to Sign In</a>
    </p>
  </div>

<script src="profile.js"></script>
</body>
</html>
