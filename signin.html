<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalVibe | Sign In</title>

<style>
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    margin: 0;
    background-color: #f4f4f5;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .login-box {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: #71717a;
    cursor: pointer;
  }

  .login-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .login-header h2 {
    margin: 0 0 6px;
    font-size: 22px;
    color: #18181b;
  }

  .login-header p {
    margin: 0;
    font-size: 14px;
    color: #71717a;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #27272a;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d4d4d8;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    border-color: #2563eb;
  }

  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .form-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #52525b;
    cursor: pointer;
  }

  .form-options a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #18181b;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .submit-btn:hover {
    background-color: #27272a;
  }

  .modal-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #e4e4e7;
    text-align: center;
    font-size: 13px;
    color: #52525b;
  }

  .modal-footer a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
  }
</style>
<style>.auth-brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto;color:#17112f;font:800 27px Arial;text-decoration:none}.auth-brand img{width:43px;height:43px}.auth-brand span span{color:#7132c8}</style>
</head>
<body>
<a class="auth-brand" href="index.html"><img src="logo.svg" alt=""><span>Local<span>Vibe</span></span></a>

  <div class="modal-overlay" id="loginModal">
    <div class="login-box">
      <button class="close-btn" onclick="document.getElementById('loginModal').style.display='none'">&times;</button>
      
      <div class="login-header">
        <h2>Welcome back</h2>
        <p>Sign in to view orders and saved items</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="userId">Email or Username</label>
          <input type="text" id="userId" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label><input type="checkbox"> Keep me signed in</label>
          <a href="forgot_password.html">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="modal-footer">
        New customer? <a href="create_account.html">Create an account</a>
      </div>
    </div>
  </div>

<script src="profile.js"></script>
</body>
</html>
