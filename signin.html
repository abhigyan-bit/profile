<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In | LocalVibe</title>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f8f2fc}.login-box{max-width:400px;margin:70px auto;background:white;padding:32px;border-radius:12px}.login-box h2{text-align:center;color:purple}.form-group{margin:18px 0}.form-group label{display:block;margin-bottom:7px}.form-group input{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px}.submit-btn{width:100%;padding:12px;background:purple;color:white;border:0;border-radius:7px;cursor:pointer}.modal-footer{text-align:center;margin-top:20px}</style></head>
<body><div class="login-box"><h2>Welcome Back</h2><p style="text-align:center">Sign in to your LocalVibe account</p>
<form id="loginForm"><div class="form-group"><label for="userId">Email</label><input type="email" id="userId" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
<button class="submit-btn" type="submit">Sign In</button></form>
<div class="modal-footer">New customer? <a href="create_account.html">Create an account</a></div></div>
<script src="app.js"></script></body></html>
