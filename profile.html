<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | LocalVibe</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header>
        <a class="brand-logo" href="index.html"><img src="logo.svg" alt="LocalVibe logo"><span>Local<span class="brand-purple">Vibe</span></span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="profile.html" class="active">Profile</a>
        </nav>
    </header>

    <main class="profile-layout">
        <aside class="sidebar">
            <div class="avatar" id="userAvatar">U</div>
            <h2 id="userName">User</h2>
            <p id="userEmail">Please sign in</p>
            <a href="profile.html">My Profile</a>
            <a href="cart.html">My Cart</a>
            <a href="index.html" id="logoutButton">Logout</a>
        </aside>

        <section class="details">
            <div class="panel">
                <h2>Overview</h2>
                <div class="overview">
                    <div><strong>0</strong><span>Total Orders</span></div>
                    <div><strong id="cartCount">0</strong><span>In Cart</span></div>
                    <div><strong>0</strong><span>On the Way</span></div>
                </div>
            </div>

            <div class="panel">
                <h2>Personal Details</h2>
                <div class="detail-row"><span>Full Name</span><p id="fullName">-</p></div>
                <div class="detail-row"><span>Email</span><p id="email">-</p></div>
            </div>
        </section>
    </main>
    <script src="profile.js"></script>
</body>
</html>
